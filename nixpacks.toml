[providers]
providers = ['php']

[phases.setup]
nixPkgs = ['php84', 'php84Extensions.pdo_mysql', 'composer']

[phases.install]
cmds = []

[phases.build]
cmds = ['composer install --optimize-autoloader --no-dev --ignore-platform-reqs']

[start]
cmd = 'vendor/bin/heroku-php-nginx -C nginx.conf public/'